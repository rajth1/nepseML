name: Test Production Sync

# Manual trigger only — this is a one-off diagnostic, not the real cron job.
# Run it once from the Actions tab ("Run workflow")

on:
  workflow_dispatch:

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Uncomment if check_production_sync.py requires external packages:
      # - name: Install dependencies
      #   run: pip install -r requirements.txt

      - name: Check production sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python check_production_sync.py
